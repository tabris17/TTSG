# Builds ttsg.exe with MSVC and MinGW when a version tag (e.g. v0.1.1) is
# pushed, and publishes the binaries to a GitHub release.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  verify:
    name: Verify tag points at main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tagged commit is reachable from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    name: Build (${{ matrix.toolchain }})
    needs: verify
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: msvc
          - toolchain: mingw
    steps:
      - uses: actions/checkout@v4

      - name: Set up MinGW (winlibs)
        if: matrix.toolchain == 'mingw'
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Configure (MSVC)
        if: matrix.toolchain == 'msvc'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DTTSG_VERSION="$env:VERSION"

      - name: Configure (MinGW)
        if: matrix.toolchain == 'mingw'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_RC_COMPILER=windres
          -DTTSG_VERSION="$env:VERSION"

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp out/ttsg.exe "dist/ttsg-${GITHUB_REF_NAME}-${{ matrix.toolchain }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ttsg-${{ matrix.toolchain }}
          path: dist/*.exe

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
